apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zentinel.fullname" . }}-control-plane
  labels:
    {{- include "zentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  selector:
    matchLabels:
      {{- include "zentinel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        {{- include "zentinel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
    spec:
      containers:
        - name: control-plane
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "zentinel.fullname" . }}-secrets
                  key: database-url
            - name: AI_AUDITOR_URL
              value: "http://{{ include "zentinel.fullname" . }}-ai-auditor:50051"
            - name: ENABLE_WAF_AUDIT
              value: {{ .Values.controlPlane.env.ENABLE_WAF_AUDIT | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zentinel.fullname" . }}-control-plane
  labels:
    {{- include "zentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  type: {{ .Values.controlPlane.service.type }}
  ports:
    - port: {{ .Values.controlPlane.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "zentinel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
