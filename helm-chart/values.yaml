# Zentinel Management Plane Configuration

global:
  postgresql:
    host: "zentinel-postgresql"
    port: 5432
    database: "zentinel_db"
    username: "zentinel"

controlPlane:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/zentinelproxy/zentinel-control-plane
    tag: "latest"
  service:
    type: ClusterIP
    port: 4000
  env:
    ENABLE_WAF_AUDIT: "true"

aiAuditor:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/zentinelproxy/zentinel-ai-auditor
    tag: "latest"
  service:
    type: ClusterIP
    port: 50051
  models:
    persistence:
      enabled: true
      size: 10Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
